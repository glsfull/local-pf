# Шаблон конфигурации панели local-pf. Демо-данных нет: сайты, фразы и ключи вводите свои.
#
# 1. Скопируйте файл в panel.yaml (он уже в .gitignore):
#      Copy-Item examples\panel.example.yaml panel.yaml
# 2. Заполните settings и раскомментируйте блок проекта, подставив свой сайт и свои фразы.
# 3. Загрузите (данные попадут в .local-pf/dashboard.sqlite3):
#      py -m dashboard --config panel.yaml
#
# Проект с тем же адресом сайта обновляется (фразы заменяются), а не создаётся заново.
# Все поля проверяются так же, как в формах панели; при ошибке ничего не сохраняется.
# То же самое можно ввести в панели: «Настройки панели» и «+ Добавить проект».

settings:
  # Ключ API сервисного аккаунта с ролью search-api.webSearch.user (Yandex Cloud → IAM → API-ключи).
  # Пустое значение не стирает сохранённый ключ. Вместо файла ключ можно задать в .env:
  # YANDEX_API_KEY=... и YANDEX_FOLDER_ID=...
  yandex_api_key: ""
  # Идентификатор каталога Yandex Cloud, в котором создан сервисный аккаунт.
  yandex_folder_id: ""
  # api — позиции через Yandex Search API (отложенные запросы, 30,5 ₽ за 1000 днём, 25,41 ₽ ночью);
  # browser — встроенный парсер выдачи в Chromium контейнера dp-agent.
  position_source: api
  # Адрес окна агента (noVNC) — ссылка «Окно агента (noVNC)» и решение капчи оператором.
  novnc_url: http://localhost:56565/

# Список ваших проектов. Пустой список — проекты добавляются в панели.
projects: []
# Структура проекта (раскомментируйте, уберите «[]» выше и подставьте свои значения):
#
# projects:
#   - name: <название проекта>
#     url: <адрес вашего сайта, например https://ваш-сайт.ru/>
#     # Код региона Яндекса: 213 — Москва, 2 — Санкт-Петербург, 225 — Россия.
#     region: 213
#     # Пауза между фразами, секунды (0–3600). После паузы следующая фраза идёт
#     # со следующим профилем Яндекса и следующим прокси из «Настроек панели».
#     interval_seconds: 10
#     # Бренд для фраз с уточнением «brand».
#     brand: <ваш бренд>
#     keywords:
#       # Уточнение используется, только если по основной фразе сайт не найден в топ-50:
#       #   domain — к фразе добавляется домен без зоны;
#       #   brand  — к фразе добавляется бренд.
#       - phrase: <поисковая фраза>
#         hint_type: domain
#       - phrase: <поисковая фраза>
#         hint_type: brand
#         # Страница, которую ожидаем увидеть в выдаче (необязательно).
#         landing_url: <адрес страницы вашего сайта>
#       # Короткая запись: только фраза, уточнение — домен без зоны.
#       - <поисковая фраза>

# Конверсии (корзина, формы, регистрация со случайными данными) в конфигурации не задаются:
# агент не отправляет фиктивные заявки и регистрации — см. docs/issue12-spec.md.
# Ключ «conversions:» будет отклонён с объяснением.
