# Тестовая конфигурация панели для tests/test_issue12.py (не пример и не демо-данные:
# шаблон для пользователя — examples/panel.example.yaml, где проекты не заполнены).

settings:
  # Ключ API сервисного аккаунта с ролью search-api.webSearch.user (Yandex Cloud → IAM → API-ключи).
  # Пустое значение не стирает сохранённый ключ. Вместо файла ключ можно задать в .env:
  # YANDEX_API_KEY=... и YANDEX_FOLDER_ID=...
  yandex_api_key: ""
  # Идентификатор каталога Yandex Cloud, в котором создан сервисный аккаунт.
  yandex_folder_id: ""
  # api — позиции через Yandex Search API (отложенные запросы, 30,5 ₽ за 1000 днём, 25,41 ₽ ночью);
  # browser — встроенный парсер выдачи в Chromium контейнера dp-agent.
  position_source: api
  # Адрес окна агента (noVNC) — ссылка «Окно агента (noVNC)» и решение капчи оператором.
  novnc_url: http://localhost:56565/

projects:
  - name: Пример — интернет-магазин
    url: https://example-shop.ru/
    # Код региона Яндекса: 213 — Москва, 2 — Санкт-Петербург, 225 — Россия.
    region: 213
    # Пауза между фразами при съёме позиций браузерным парсером, секунды (0–3600).
    interval_seconds: 10
    # Бренд по умолчанию для фраз с уточнением «brand».
    brand: Пример Шоп
    keywords:
      # Уточнение используется, только если по основной фразе сайт не найден в топ-50:
      #   domain — к фразе добавляется домен без зоны: «купить диван example-shop»;
      #   brand  — к фразе добавляется бренд: «купить диван Пример Шоп».
      - phrase: купить диван
        hint_type: domain
      - phrase: угловой диван недорого
        hint_type: brand
      - phrase: диван кровать с доставкой
        hint_type: brand
        brand: ПримерШоп
        # Страница, которую ожидаем увидеть в выдаче (необязательно, адрес сайта проекта или поддомена).
        landing_url: https://example-shop.ru/catalog/sofa-beds/
      # Короткая запись: только фраза, уточнение — домен без зоны.
      - диваны москва

  - name: Пример — услуги
    url: example-service.ru
    region: 2
    keywords:
      - phrase: ремонт квартир под ключ
      - phrase: дизайн интерьера цена
        hint_type: brand
        brand: Пример Сервис

# Конверсии (корзина, формы, регистрация со случайными данными) в конфигурации не задаются:
# агент не отправляет фиктивные заявки и регистрации — см. docs/issue12-spec.md.
# Ключ «conversions:» будет отклонён с объяснением.
