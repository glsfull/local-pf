# Разовая проверка без панели: python agent.py. Демо-данных нет — заполните свои значения.
# Фраза, по которой ищется сайт в Яндексе, например «натяжные потолки москва».
SEARCH_KEYWORD: ""
# Домен вашего сайта без схемы и пути, например «ваш-сайт.ru».
TARGET_DOMAIN: ""
# Страницы сайта, которые агент открывает после перехода из выдачи:
#   - url: "/catalog/"            # путь внутри сайта
#     expected_selector: "h1"     # элемент, который должен появиться на странице
TARGET_PAGES: []

SEARCH_INPUT_SELECTOR: "#text, input[name='text']"
SEARCH_BUTTON_SELECTOR: "#search-button, button[type='submit']"
RESULT_LINK_SELECTOR: "a.OrganicTitle-Link, .serp-item h2 a, .serp-item h3 a"
CAPTCHA_SELECTOR: "[data-sitekey], input[name='smart-token'], #checkbox-captcha-form"
TIMEOUT_SECONDS: 15
OBSERVATION_DELAY_SECONDS: 0.7

# Глубина поиска агента: страниц выдачи по 10 результатов (1–5, до 50-й позиции).
SEARCH_DEPTH_PAGES: 5
NEXT_PAGE_SELECTOR: "a.Pager-Item_type_next, a[aria-label='Следующая страница']"
