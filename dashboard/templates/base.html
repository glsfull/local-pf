<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{% endblock %} · local-pf</title>
  <link rel="icon" href="{{ url_for('static', filename='mark.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
  <script defer src="{{ url_for('static', filename='panel.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <aside class="sidebar">
    <a class="logo" href="{{ url_for('projects') }}">
      <img src="{{ url_for('static', filename='mark.svg') }}" alt="" width="35" height="35">
      <span>local-pf<small>Мониторинг позиций</small></span>
    </a>
    <nav aria-label="Основная навигация">
      <a href="{{ url_for('projects') }}" {% if request.endpoint in ('projects', 'project', 'edit_project') %}aria-current="{{ 'page' if request.endpoint == 'projects' else 'true' }}"{% endif %}>
        <span class="nav-icon grid-icon" aria-hidden="true"></span> Проекты
      </a>
      {% if agent_logs_enabled %}
      <a href="{{ url_for('agent_logs') }}" {% if request.endpoint == 'agent_logs' %}aria-current="page"{% endif %}>
        <span class="nav-icon logs-icon" aria-hidden="true"></span> Логи
      </a>
      {% endif %}
      <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}aria-current="page"{% endif %}>
        <span class="nav-icon settings-icon" aria-hidden="true"></span> Настройки
      </a>
    </nav>
    <a class="provider" href="{{ url_for('settings') }}">
      <span class="provider-dot {{ 'ready' if configured else '' }}" aria-hidden="true"></span>
      <span>{{ source }}<small>{{ 'Локальный пример' if demo else ('Реквизиты заданы' if configured else 'Требуется подключение') }}</small></span>
    </a>
  </aside>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
